# PIPELINE DEFINITION
# Name: hit-song-pipeline
components:
  comp-evaluate-model:
    executorLabel: exec-evaluate-model
    inputDefinitions:
      artifacts:
        data_csv:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
        model_path:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
    outputDefinitions:
      artifacts:
        accuracy_out:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
  comp-generate-data:
    executorLabel: exec-generate-data
    outputDefinitions:
      artifacts:
        output_csv:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
  comp-train-model:
    executorLabel: exec-train-model
    inputDefinitions:
      artifacts:
        input_csv:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
    outputDefinitions:
      artifacts:
        model_out:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-evaluate-model:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - evaluate_model
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.14.6'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef evaluate_model(data_csv: dsl.InputPath(), model_path: dsl.InputPath(),\
          \ accuracy_out: dsl.OutputPath()):\n    import pandas as pd\n    import\
          \ xgboost as xgb\n    from sklearn.metrics import accuracy_score\n\n   \
          \ df = pd.read_csv(data_csv)\n    X = df[['tempo', 'energy', 'danceability',\
          \ 'valence']]\n    y = df['hit']\n\n    model = xgb.XGBClassifier()\n  \
          \  model.load_model(model_path)\n    preds = model.predict(X)\n    acc =\
          \ accuracy_score(y, preds)\n    print(f\"\u2705 Model Accuracy: {acc}\"\
          )\n\n    with open(accuracy_out, 'w') as f:\n        f.write(str(acc))\n\
          \n"
        image: local-kfp-xgb:1.0
    exec-generate-data:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - generate_data
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.14.6'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef generate_data(output_csv: dsl.OutputPath()):\n    import pandas\
          \ as pd\n    import numpy as np\n\n    df = pd.DataFrame({\n        'tempo':\
          \ np.random.randint(60, 180, 100),\n        'energy': np.random.rand(100),\n\
          \        'danceability': np.random.rand(100),\n        'valence': np.random.rand(100),\n\
          \        'hit': np.random.randint(0, 2, 100)\n    })\n\n    df.to_csv(output_csv,\
          \ index=False)\n    print(f\"\u2705 Data generated and saved to: {output_csv}\"\
          )\n\n"
        image: local-kfp-xgb:1.0
    exec-train-model:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - train_model
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.14.6'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef train_model(input_csv: dsl.InputPath(), model_out: dsl.OutputPath()):\n\
          \    import pandas as pd\n    import xgboost as xgb\n    from sklearn.model_selection\
          \ import train_test_split\n\n    df = pd.read_csv(input_csv)\n    X = df[['tempo',\
          \ 'energy', 'danceability', 'valence']]\n    y = df['hit']\n\n    X_train,\
          \ X_test, y_train, y_test = train_test_split(X, y, test_size=0.2)\n    model\
          \ = xgb.XGBClassifier(use_label_encoder=False, eval_metric='logloss')\n\
          \    model.fit(X_train, y_train)\n    model.save_model(model_out)\n    print(f\"\
          \u2705 Model saved to: {model_out}\")\n\n"
        image: local-kfp-xgb:1.0
pipelineInfo:
  name: hit-song-pipeline
root:
  dag:
    tasks:
      evaluate-model:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-evaluate-model
        dependentTasks:
        - generate-data
        - train-model
        inputs:
          artifacts:
            data_csv:
              taskOutputArtifact:
                outputArtifactKey: output_csv
                producerTask: generate-data
            model_path:
              taskOutputArtifact:
                outputArtifactKey: model_out
                producerTask: train-model
        taskInfo:
          name: evaluate-model
      generate-data:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-generate-data
        taskInfo:
          name: generate-data
      train-model:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-train-model
        dependentTasks:
        - generate-data
        inputs:
          artifacts:
            input_csv:
              taskOutputArtifact:
                outputArtifactKey: output_csv
                producerTask: generate-data
        taskInfo:
          name: train-model
schemaVersion: 2.1.0
sdkVersion: kfp-2.14.6
